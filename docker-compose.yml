services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: space_mmo
      POSTGRES_PASSWORD: space_mmo_dev
      POSTGRES_DB: space_mmo
    ports:
      - "5432:5432"
    volumes:
      - space_mmo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space_mmo -d space_mmo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  space_mmo_pg:
